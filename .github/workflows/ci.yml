name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: nothing in this workflow writes to the repository
permissions:
  contents: read

jobs:
  lint:
    name: Lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # composer.json declares php ^8.1: floor to newest
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      # Actions are pinned to a commit SHA; the comment names the release it was taken from
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax check every PHP file
        run: find src tests examples -name '*.php' -print0 | xargs -0 -n1 php -l

  unit:
    name: Unit PHP ${{ matrix.php }}${{ matrix.lowest && ' (lowest deps)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        lowest: [false]
        include:
          # The oldest dependency versions composer.json allows, on the oldest PHP
          - php: '8.1'
            lowest: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        # No lock file is committed (library), so this resolves per PHP version, like a consumer would
        run: composer update --no-interaction --no-progress ${{ matrix.lowest && '--prefer-lowest' || '' }}
      - name: Run the standalone suite
        # Every HTTP call is answered by a Guzzle MockHandler: no network, no API token needed
        run: vendor/bin/phpunit

  silverstripe:
    name: Silverstripe 5 / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The integration layer is Silverstripe 5 only (SiteConfigExtension extends DataExtension,
        # which Silverstripe 6 removed), at the oldest and newest PHP used with it here
        php: ['8.1', '8.3']

    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ss_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Check out the package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, mysqli, zip, dom, xml, tokenizer, simplexml, ctype, hash, session
          tools: composer:v2
          coverage: none

      - name: Build a host project
        # The integration classes need a booted Silverstripe app. The package is pulled in through a
        # PATH repository, symlinked ON PURPOSE: /tests is export-ignore in .gitattributes, so a
        # mirrored (dist-style) install would contain no tests and the suite would pass empty.
        run: |
          mkdir -p app-host
          cd app-host
          cat > composer.json <<JSON
          {
            "name": "restruct/ci-host",
            "require": {
              "silverstripe/recipe-cms": "^5",
              "silverstripe/recipe-testing": "^3",
              "restruct/edudex-api-client": "*"
            },
            "repositories": [
              { "type": "path", "url": "../module", "options": { "symlink": true } }
            ],
            "minimum-stability": "dev",
            "prefer-stable": true,
            "config": { "allow-plugins": true }
          }
          JSON
          # Silverstripe 5 is security-fixes-only and every silverstripe/cms 5 release is covered by
          # an advisory that will not be patched there, so Composer refuses it under the default
          # policy. Blocking is disabled HERE ONLY, in a throwaway CI host project.
          composer config policy.advisories.block false
          composer update --no-interaction --no-progress

      - name: Configure the test suite
        run: |
          cd app-host
          cat > phpunit.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!-- failOnSkipped: a skip here would silently shrink the suite -->
          <phpunit bootstrap="vendor/silverstripe/framework/tests/bootstrap.php" colors="true"
                   failOnWarning="true" failOnSkipped="true">
              <testsuites>
                  <testsuite name="edudex-silverstripe">
                      <directory>vendor/restruct/edudex-api-client/tests/SilverStripe</directory>
                  </testsuite>
              </testsuites>
          </phpunit>
          XML

      - name: Run the Silverstripe suite
        working-directory: app-host
        env:
          SS_DATABASE_CLASS: MySQLDatabase
          SS_DATABASE_SERVER: 127.0.0.1
          SS_DATABASE_PORT: 3306
          SS_DATABASE_USERNAME: root
          SS_DATABASE_PASSWORD: root
          SS_DATABASE_NAME: ss_ci
          SS_ENVIRONMENT_TYPE: dev
        # Framework 5 reads the manifest flush only from a path-first `flush=1` argument
        run: vendor/bin/phpunit vendor/restruct/edudex-api-client/tests/SilverStripe flush=1

      - name: Boot the app and build the database
        # Proves the package's _config (SiteConfig extension, Injector mapping) survives a real boot
        working-directory: app-host
        env:
          SS_DATABASE_CLASS: MySQLDatabase
          SS_DATABASE_SERVER: 127.0.0.1
          SS_DATABASE_PORT: 3306
          SS_DATABASE_USERNAME: root
          SS_DATABASE_PASSWORD: root
          SS_DATABASE_NAME: ss_ci
          SS_ENVIRONMENT_TYPE: dev
        run: vendor/bin/sake dev/build flush=1
